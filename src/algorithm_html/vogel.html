<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORA Advanced - Aproximación de Vogel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base unificados */
        body { 
            background-color: #0b0914; 
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% 0%, #1f1642 0%, transparent 70%);
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0914; }
        ::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 4px; }
        
        .panel-tora {
            background-color: #120e24;
            border: 1px solid #2d2252;
        }

        .btn-neon {
            background: linear-gradient(to right, #7e22ce, #c026d3);
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            background: linear-gradient(to right, #9333ea, #d946ef);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
        }

        .input-tora {
            background-color: #0b0914;
            border: 1px solid #2d2252;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-tora:focus {
            border-color: #d946ef;
        }

        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased p-6 md:p-8"> 

    <!-- Barra Superior -->
    <nav class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors font-semibold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Menú Principal
        </a>
        
        <h1 class="text-2xl font-black text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            Módulo: <span class="text-fuchsia-400 font-light">Aproximación de Vogel (VAM)</span>
        </h1>
    </nav>

    <!-- Contenedor Principal -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- COLUMNA IZQUIERDA: Controles -->
        <section class="lg:col-span-4 flex flex-col gap-6">
            
            <div class="panel-tora rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-cyan-500 pl-2">1. Configurar Red</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Orígenes (Filas)</label>
                        <input type="number" id="num-filas" value="3" min="2" max="10" class="input-tora w-full rounded p-2 text-center font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Destinos (Cols)</label>
                        <input type="number" id="num-cols" value="4" min="2" max="10" class="input-tora w-full rounded p-2 text-center font-bold text-lg">
                    </div>
                </div>
                
                <button onclick="generarTabla()" class="btn-neon w-full font-semibold py-2.5 rounded-lg flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"></path></svg>
                    Generar Matriz
                </button>
            </div>

            <div class="panel-tora rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-fuchsia-500 pl-2">2. Ejecutar Solución</h2>
                <button onclick="resolverVogel()" class="w-full bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-[#0b0914] font-bold py-2.5 rounded-lg transition-colors">
                    Calcular (Método de Vogel)
                </button>
            </div>

            <div id="panel-resultados" class="panel-tora rounded-2xl p-6 shadow-lg hidden fade-in">
                <h2 class="text-lg font-bold text-white mb-2 border-l-4 border-green-500 pl-2">Costo Total de Envío (Z)</h2>
                <p class="text-slate-400 text-sm mb-2" id="estado-balance"></p>
                <div class="flex items-center gap-2">
                    <span class="text-4xl font-black text-cyan-400">$</span>
                    <div class="text-4xl font-black text-cyan-400" id="costo-total">0</div>
                </div>
            </div>

        </section>

        <!-- COLUMNA DERECHA: Matriz -->
        <section class="lg:col-span-8 flex flex-col gap-6">
            
            <div class="panel-tora rounded-2xl p-6 shadow-lg overflow-hidden">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-fuchsia-500 pl-2">Matriz de Costos, Oferta y Demanda</h2>
                
                <div class="overflow-x-auto pb-4">
                    <div id="matriz-container" class="w-full text-center text-slate-500 py-8">
                        Haz clic en "Generar Matriz" para empezar.
                    </div>
                </div>
            </div>

            <!-- Bitácora de Envíos -->
            <div id="panel-rutas" class="panel-tora rounded-2xl p-6 shadow-lg hidden fade-in">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-cyan-500 pl-2">Rutas de Envío (Asignación VAM)</h2>
                <div id="rutas-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-2">
                    <!-- Inyectado por JS -->
                </div>
            </div>

        </section>
    </div>

    <!-- Script de Lógica VOGEL -->
    <script>
        let filas = 0;
        let cols = 0;

        function generarTabla() {
            filas = parseInt(document.getElementById('num-filas').value);
            cols = parseInt(document.getElementById('num-cols').value);
            const container = document.getElementById('matriz-container');
            
            let html = '<table class="w-full border-collapse border border-[#2d2252] text-sm min-w-max">';
            
            html += '<thead><tr><th class="border border-[#2d2252] p-3 bg-[#1f163b] text-slate-300">O \\ D</th>';
            for (let j = 0; j < cols; j++) {
                html += `<th class="border border-[#2d2252] p-3 bg-[#1f163b] text-cyan-400 font-bold">Destino ${j+1}</th>`;
            }
            html += `<th class="border border-[#2d2252] p-3 bg-[#3b1638] text-fuchsia-400 font-bold">Oferta</th></tr></thead><tbody>`;

            for (let i = 0; i < filas; i++) {
                html += `<tr><th class="border border-[#2d2252] p-3 bg-[#1f163b] text-cyan-400 font-bold whitespace-nowrap">Origen ${i+1}</th>`;
                
                for (let j = 0; j < cols; j++) {
                    html += `<td class="border border-[#2d2252] p-1 relative bg-[#0b0914] transition-colors" id="celda-${i}-${j}">
                                <div class="absolute top-1 right-1">
                                    <input type="number" id="c-${i}-${j}" placeholder="Costo" class="w-12 text-xs bg-transparent text-right text-slate-400 outline-none border-b border-[#2d2252] focus:border-cyan-400">
                                </div>
                                <div class="w-full h-full pt-6 pb-2 px-2 flex items-center justify-center">
                                    <span id="asig-${i}-${j}" class="text-fuchsia-400 font-black text-xl hidden fade-in">0</span>
                                </div>
                             </td>`;
                }
                
                html += `<td class="border border-[#2d2252] p-2 bg-[#120e24]">
                            <input type="number" id="of-${i}" placeholder="0" class="w-full bg-transparent text-center text-fuchsia-400 font-bold outline-none text-lg">
                         </td></tr>`;
            }

            html += `<tr><th class="border border-[#2d2252] p-3 bg-[#3b1638] text-fuchsia-400 font-bold whitespace-nowrap">Demanda</th>`;
            for (let j = 0; j < cols; j++) {
                html += `<td class="border border-[#2d2252] p-2 bg-[#120e24]">
                            <input type="number" id="dem-${j}" placeholder="0" class="w-full bg-transparent text-center text-fuchsia-400 font-bold outline-none text-lg">
                         </td>`;
            }
            html += `<td class="border border-[#2d2252] p-2 bg-[#1f163b]"></td></tr>`;

            html += '</tbody></table>';

            container.innerHTML = html;
            document.getElementById('panel-resultados').classList.add('hidden');
            document.getElementById('panel-rutas').classList.add('hidden');
        }

        function resolverVogel() {
            if (filas === 0 || cols === 0) return alert('Genera la tabla primero.');

            let costos = [];
            let oferta = [];
            let demanda = [];
            let asigUI = [];

            // Limpiar matriz de UI y leer datos
            for (let i = 0; i < filas; i++) {
                let fCostos = [];
                for (let j = 0; j < cols; j++) {
                    fCostos.push(parseFloat(document.getElementById(`c-${i}-${j}`).value) || 0);
                    
                    let span = document.getElementById(`asig-${i}-${j}`);
                    span.innerText = "";
                    span.classList.add('hidden');
                    document.getElementById(`celda-${i}-${j}`).classList.remove('bg-fuchsia-900/20');
                }
                costos.push(fCostos);
            }

            let sumaOferta = 0;
            for (let i = 0; i < filas; i++) {
                let v = parseFloat(document.getElementById(`of-${i}`).value) || 0;
                oferta.push(v);
                sumaOferta += v;
            }

            let sumaDemanda = 0;
            for (let j = 0; j < cols; j++) {
                let v = parseFloat(document.getElementById(`dem-${j}`).value) || 0;
                demanda.push(v);
                sumaDemanda += v;
            }

            // Validar Balanceo
            let estadoBalance = document.getElementById('estado-balance');
            if (sumaOferta !== sumaDemanda) {
                estadoBalance.innerHTML = `<span class="text-red-400">⚠️ Problema no balanceado (Of: ${sumaOferta} | Dem: ${sumaDemanda}). Calculando factible parcial.</span>`;
            } else {
                estadoBalance.innerHTML = `<span class="text-green-400">✓ Problema balanceado perfectamente.</span>`;
            }

            // --- LÓGICA VOGEL ---
            let filasActivas = new Array(filas).fill(true);
            let colsActivas = new Array(cols).fill(true);
            let asignaciones = [];
            let costoTotal = 0;

            let numFilasActivas = filas;
            let numColsActivas = cols;

            while (numFilasActivas > 0 && numColsActivas > 0) {
                let penalFilas = new Array(filas).fill(-1);
                let penalCols = new Array(cols).fill(-1);

                // Calcular Penalizaciones Filas
                for (let i = 0; i < filas; i++) {
                    if (!filasActivas[i]) continue;
                    let cDisp = [];
                    for (let j = 0; j < cols; j++) {
                        if (colsActivas[j]) cDisp.push(costos[i][j]);
                    }
                    cDisp.sort((a, b) => a - b);
                    if (cDisp.length >= 2) penalFilas[i] = cDisp[1] - cDisp[0];
                    else if (cDisp.length === 1) penalFilas[i] = cDisp[0];
                }

                // Calcular Penalizaciones Columnas
                for (let j = 0; j < cols; j++) {
                    if (!colsActivas[j]) continue;
                    let cDisp = [];
                    for (let i = 0; i < filas; i++) {
                        if (filasActivas[i]) cDisp.push(costos[i][j]);
                    }
                    cDisp.sort((a, b) => a - b);
                    if (cDisp.length >= 2) penalCols[j] = cDisp[1] - cDisp[0];
                    else if (cDisp.length === 1) penalCols[j] = cDisp[0];
                }

                // Buscar Máxima Penalización
                let maxPenal = -1;
                let idxMax = -1;
                let esFila = true;

                for (let i = 0; i < filas; i++) {
                    if (penalFilas[i] > maxPenal) { maxPenal = penalFilas[i]; idxMax = i; esFila = true; }
                }
                for (let j = 0; j < cols; j++) {
                    if (penalCols[j] > maxPenal) { maxPenal = penalCols[j]; idxMax = j; esFila = false; }
                }

                // Si no se encuentran penalizaciones válidas, romper ciclo preventivo
                if (maxPenal === -1) break;

                // Encontrar el menor costo en la Fila o Columna elegida
                let minCosto = Infinity;
                let fElegida = -1;
                let cElegida = -1;

                if (esFila) {
                    fElegida = idxMax;
                    for (let j = 0; j < cols; j++) {
                        if (colsActivas[j] && costos[fElegida][j] < minCosto) {
                            minCosto = costos[fElegida][j];
                            cElegida = j;
                        }
                    }
                } else {
                    cElegida = idxMax;
                    for (let i = 0; i < filas; i++) {
                        if (filasActivas[i] && costos[i][cElegida] < minCosto) {
                            minCosto = costos[i][cElegida];
                            fElegida = i;
                        }
                    }
                }

                // Asignar el máximo posible
                let cantidad = Math.min(oferta[fElegida], demanda[cElegida]);
                if (cantidad > 0) {
                    asignaciones.push({ 
                        origen: fElegida, destino: cElegida, 
                        cantidad: cantidad, costoUnitario: minCosto 
                    });
                    costoTotal += (cantidad * minCosto);

                    // Actualizar UI en vivo
                    let span = document.getElementById(`asig-${fElegida}-${cElegida}`);
                    span.innerText = cantidad;
                    span.classList.remove('hidden');
                    document.getElementById(`celda-${fElegida}-${cElegida}`).classList.add('bg-fuchsia-900/20');
                }

                oferta[fElegida] -= cantidad;
                demanda[cElegida] -= cantidad;

                // Tachar fila o columna agotada
                if (oferta[fElegida] === 0 && demanda[cElegida] === 0) {
                    filasActivas[fElegida] = false; numFilasActivas--;
                    // Para evitar eliminar ambas y trancar el método, dejamos la demanda en 0 activa temporalmente
                } else if (oferta[fElegida] === 0) {
                    filasActivas[fElegida] = false; numFilasActivas--;
                } else {
                    colsActivas[cElegida] = false; numColsActivas--;
                }
            }

            // Renderizar Rutas
            let rutasHtml = '';
            asignaciones.forEach(asig => {
                let costoRuta = asig.cantidad * asig.costoUnitario;
                rutasHtml += `
                <div class="bg-[#0b0914] border border-[#2d2252] p-3 rounded-lg flex flex-col justify-between">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-cyan-400 font-bold text-sm">Origen ${asig.origen + 1}</span> 
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        <span class="text-cyan-400 font-bold text-sm">Destino ${asig.destino + 1}</span>
                    </div>
                    <div class="text-slate-300 text-xs">
                        Envío: <span class="text-fuchsia-400 font-bold text-base">${asig.cantidad}</span> unds x $${asig.costoUnitario}
                        <div class="text-green-400 font-bold mt-1">= $${costoRuta}</div>
                    </div>
                </div>`;
            });

            document.getElementById('rutas-container').innerHTML = rutasHtml;
            document.getElementById('costo-total').innerText = costoTotal;
            document.getElementById('panel-resultados').classList.remove('hidden');
            document.getElementById('panel-rutas').classList.remove('hidden');
        }

        window.onload = generarTabla;
    </script>
</body>
</html>
