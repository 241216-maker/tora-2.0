<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CAMBIA EL TÍTULO SEGÚN EL ALGORITMO -->
    <title>TORA Advanced - Nombre del Algoritmo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mismos estilos base del Menú Principal */
        body { 
            background-color: #0b0914; 
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% 0%, #1f1642 0%, transparent 70%);
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0914; }
        ::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 4px; }
        
        /* Clase para los paneles oscuros */
        .panel-tora {
            background-color: #120e24;
            border: 1px solid #2d2252;
        }

        /* Botón estilo Neón del Menú */
        .btn-neon {
            background: linear-gradient(to right, #7e22ce, #c026d3); /* purple-700 to fuchsia-600 */
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            background: linear-gradient(to right, #9333ea, #d946ef);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
        }

        /* Estilo para los inputs de números */
        .input-tora {
            background-color: #0b0914;
            border: 1px solid #2d2252;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-tora:focus {
            border-color: #d946ef; /* fuchsia-500 */
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased p-6 md:p-8"> 

    <!-- Barra Superior de Navegación -->
    <nav class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors font-semibold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Menú Principal
        </a>
        
        <h1 class="text-2xl font-black text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            <!-- CAMBIA ESTO SEGÚN EL ALGORITMO -->
            Módulo: <span class="text-fuchsia-400 font-light">Esquina Noroeste</span>
        </h1>
    </nav>

    <!-- Contenedor del Algoritmo -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- COLUMNA IZQUIERDA: Controles y Configuración -->
        <section class="lg:col-span-4 flex flex-col gap-6">
            
            <div class="panel-tora rounded-2xl p-6">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-cyan-500 pl-2">1. Configurar Dimensiones</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Orígenes / Filas</label>
                        <input type="number" id="num-filas" value="3" min="2" class="input-tora w-full rounded p-2 text-center font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Destinos / Columnas</label>
                        <input type="number" id="num-cols" value="4" min="2" class="input-tora w-full rounded p-2 text-center font-bold">
                    </div>
                </div>
                
                <button class="btn-neon w-full font-semibold py-2.5 rounded-lg flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Generar Tabla
                </button>
            </div>

            <div class="panel-tora rounded-2xl p-6">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-fuchsia-500 pl-2">2. Ejecutar</h2>
                <button class="w-full bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-slate-900 font-bold py-2.5 rounded-lg transition-colors">
                    Calcular Solución
                </button>
            </div>

            <!-- Panel de Resultados (Oculto por defecto, muéstralo con JS) -->
            <div id="panel-resultados" class="panel-tora rounded-2xl p-6">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-green-500 pl-2">Costo Total (Z)</h2>
                <div class="flex items-center gap-2">
                    <span class="text-4xl font-black text-cyan-400">$</span>
                    <div class="text-4xl font-black text-cyan-400" id="costo-total">0.00</div>
                </div>
            </div>

        </section>

        <!-- COLUMNA DERECHA: Tablas y Matriz -->
        <section class="lg:col-span-8 flex flex-col gap-6">
            
            <div class="panel-tora rounded-2xl p-6">
                <h2 class="text-lg font-bold text-white mb-4 border-l-4 border-fuchsia-500 pl-2">Matriz de Costos y Asignaciones</h2>
                
                <!-- Contenedor de la Tabla -->
                <div class="overflow-x-auto">
                    <!-- Ejemplo de cómo debe verse tu tabla generada por JS -->
                    <table class="w-full border-collapse border border-[#2d2252] text-sm mt-4">
                        <thead>
                            <tr>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-slate-300">O \ D</th>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-cyan-400">Destino 1</th>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-cyan-400">Destino 2</th>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-fuchsia-400">Oferta</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-cyan-400 whitespace-nowrap">Origen 1</th>
                                <td class="border border-[#2d2252] p-2 bg-[#0b0914] text-center"><input type="number" class="w-full bg-transparent text-center text-white outline-none" placeholder="0"></td>
                                <td class="border border-[#2d2252] p-2 bg-[#0b0914] text-center"><input type="number" class="w-full bg-transparent text-center text-white outline-none" placeholder="0"></td>
                                <td class="border border-[#2d2252] p-2 bg-[#120e24] text-center"><input type="number" class="w-full bg-transparent text-center text-fuchsia-400 font-bold outline-none" placeholder="0"></td>
                            </tr>
                            <tr>
                                <th class="border border-[#2d2252] p-3 bg-[#1f163b] text-fuchsia-400 whitespace-nowrap">Demanda</th>
                                <td class="border border-[#2d2252] p-2 bg-[#120e24] text-center"><input type="number" class="w-full bg-transparent text-center text-fuchsia-400 font-bold outline-none" placeholder="0"></td>
                                <td class="border border-[#2d2252] p-2 bg-[#120e24] text-center"><input type="number" class="w-full bg-transparent text-center text-fuchsia-400 font-bold outline-none" placeholder="0"></td>
                                <td class="border border-[#2d2252] p-2 bg-[#1f163b]"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </section>
    </div>

    <!-- AQUÍ VA TU SCRIPT DE LÓGICA DE JAVASCRIPT -->
    <script>
        // Aquí pegas la lógica de tus algoritmos (generarTabla, calcularEsquinaNoroeste, etc.)
    </script>
</body>
</html>
